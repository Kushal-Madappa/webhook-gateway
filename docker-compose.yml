# `docker compose up` from a clean clone brings up Postgres, the API, the delivery
# worker, and a throwaway `echo` downstream used by the demo. Migrations run
# automatically via entrypoint.sh before the API starts.
#
# Run multiple workers to prove concurrency safety:
#   docker compose up --scale worker=3
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: gateway
      POSTGRES_PASSWORD: gateway
      POSTGRES_DB: gateway
    ports:
      # Host 5433 -> container 5432 (host 5432 is often taken by a local Postgres).
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gateway -d gateway"]
      interval: 3s
      timeout: 3s
      retries: 20

  # One-shot: applies migrations then exits. api and worker wait for it to
  # complete, so migrations run exactly once regardless of replica counts.
  migrate:
    build: .
    command: ["migrate"]
    environment:
      DATABASE_URL: postgresql+psycopg://gateway:gateway@db:5432/gateway
    depends_on:
      db:
        condition: service_healthy

  api:
    build: .
    command: ["api"]
    environment:
      DATABASE_URL: postgresql+psycopg://gateway:gateway@db:5432/gateway
      ADMIN_TOKEN: change-me-admin-token
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "8000:8000"

  worker:
    build: .
    command: ["worker"]
    environment:
      DATABASE_URL: postgresql+psycopg://gateway:gateway@db:5432/gateway
      # Tuning knobs default to production-sane values but can be overridden from
      # the host env, e.g. `MAX_ATTEMPTS=3 BASE_BACKOFF_SECONDS=0.3 docker compose up`.
      MAX_ATTEMPTS: ${MAX_ATTEMPTS:-6}
      BASE_BACKOFF_SECONDS: ${BASE_BACKOFF_SECONDS:-2}
      MAX_BACKOFF_SECONDS: ${MAX_BACKOFF_SECONDS:-3600}
      WORKER_POLL_INTERVAL_SECONDS: ${WORKER_POLL_INTERVAL_SECONDS:-1}
      DELIVERY_TIMEOUT_SECONDS: ${DELIVERY_TIMEOUT_SECONDS:-10}
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Throwaway downstream for the demo/tests. httpbin echoes and can be told to
  # return specific status codes (e.g. POST /status/500), which lets us exercise
  # the retry path. NOT part of the gateway itself.
  echo:
    image: kennethreitz/httpbin
    ports:
      - "9080:80"

volumes:
  pgdata:
